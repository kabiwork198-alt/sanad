name: Build Windows portable app

on:
  push:
    branches:
      - 'arena/592bf7be-sanad'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build and PDF tools
        run: python -m pip install pyinstaller==6.11.1 -r requirements.txt
      - name: Test application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $output = (& python -m unittest discover -s tests -v 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Output $output
          if ($code -ne 0) {
            $escaped = $output.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Application tests failed::$escaped"
            exit $code
          }
      - name: Diagnose live public source access on Windows
        run: python tests/live_windows_sources.py
      - name: Diagnose Qatar record search
        run: python -c "import runpy; runpy.run_path('tests/live_qdl.py')"
      - name: Diagnose multilingual Wikisource
        run: python -c "import runpy; runpy.run_path('tests/live_wikisource_multilingual.py')"
      - name: Diagnose live Wikimedia article pageviews
        run: python -c "import runpy; runpy.run_path('tests/live_pageviews.py')"
      - name: Diagnose real Wikipedia topics and sections
        run: python -c "import runpy; runpy.run_path('tests/live_topic_ideas.py')"
      - name: Diagnose real Arabic Wikisource batches
        run: python -c "import runpy; runpy.run_path('tests/live_wikisource_batch.py')"
      - name: Diagnose live OpenAlex open-copy lookup
        run: python -c "import runpy; runpy.run_path('tests/live_open_access.py')"
      - name: Diagnose live Open Library editions and OCR
        run: python -c "import runpy; runpy.run_path('tests/live_openlibrary_editions.py')"
      - name: Diagnose local search over real OpenITI ZIP sample
        run: python tests/live_openiti_corpus.py
      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean --onefile --console --name Sanad-Studio --add-data "web;web" launch.py
      - name: Install real OCR browser test driver
        shell: pwsh
        run: npm install --prefix "$env:RUNNER_TEMP\sanad-qa" puppeteer-core@24 --no-audit --no-fund
      - name: Smoke test executable
        shell: pwsh
        run: |
          $env:SANAD_DATA_DIR = Join-Path $env:RUNNER_TEMP 'sanad-smoke-data'
          $process = Start-Process -FilePath "$PWD\dist\Sanad-Studio.exe" -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              if ($process.HasExited) { throw 'Application exited before responding.' }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/' -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match 'سَنَد') { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw 'Executable did not serve the local application.' }
            $script = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/app.js' -UseBasicParsing -TimeoutSec 2
            if ($script.StatusCode -ne 200 -or $script.Content -notmatch 'projectTemplate') { throw 'Bundled assets are missing.' }
            $env:NODE_PATH = Join-Path $env:RUNNER_TEMP 'sanad-qa\node_modules'
            $env:CHROME_BIN = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
            $env:SANAD_TEST_ORIGIN = 'http://127.0.0.1:8765/'
            $env:SANAD_TEST_PYTHON = (Get-Command python).Source
            function Test-BundledUi([string]$file) {
              $output = (& node $file 2>&1 | Out-String)
              $code = $LASTEXITCODE
              Write-Output $output
              if ($code -ne 0) {
                $escaped = $output.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Output "::error title=Bundled UI test failed: ${file}::$escaped"
                throw "Bundled UI test failed: $file"
              }
            }
            Test-BundledUi 'tests/ui_real_workflow.cjs'
            Test-BundledUi 'tests/ui_text_alignment.cjs'
            Test-BundledUi 'tests/ui_hadith.cjs'
            node tests/live_hadith.cjs
            if ($LASTEXITCODE -ne 0) { Write-Warning 'Live hadith service unavailable; this diagnostic does not assess text or rights.' }
            Test-BundledUi 'tests/ui_pdf_security.cjs'
            Test-BundledUi 'tests/ui_history.cjs'
            Test-BundledUi 'tests/ui_open_access.cjs'
            $env:SANAD_TEST_MOCK_TOPICS = '1'
            Test-BundledUi 'tests/ui_topic_ideas.cjs'
            Remove-Item Env:SANAD_TEST_MOCK_TOPICS
            $env:SANAD_TEST_MOCK_API = '1'
            Test-BundledUi 'tests/ui_wikisource_batch.cjs'
            Remove-Item Env:SANAD_TEST_MOCK_API
            Test-BundledUi 'tests/ui_smart_research.cjs'
            Test-BundledUi 'tests/ui_source_reading.cjs'
            Test-BundledUi 'tests/ui_source_checkpoint.cjs'
            Test-BundledUi 'tests/ui_research_expanded.cjs'
            Test-BundledUi 'tests/ui_heritage_research.cjs'
            Test-BundledUi 'tests/ui_ocr_batch.cjs'
            Test-BundledUi 'tests/ui_mineru.cjs'
            Test-BundledUi 'tests/ui_ocr.cjs'
            Test-BundledUi 'tests/ui_exe_corpus.cjs'
          } finally {
            if (-not $process.HasExited) { & taskkill /PID $process.Id /T /F | Out-Null }
          }
      - name: Add instructions
        shell: pwsh
        run: Copy-Item docs/windows-portable.txt dist/README.txt
      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: Sanad-Studio-Windows
          path: |
            dist/Sanad-Studio.exe
            dist/README.txt
          if-no-files-found: error
          retention-days: 90
