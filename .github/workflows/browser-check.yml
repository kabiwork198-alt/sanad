name: Check browser edition
on:
  push:
    branches:
      - 'arena/592bf7be-sanad'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js
      - run: node --check web/browser-engine.js
      - run: node tests/test_browser_engine.cjs
      - run: node tests/test_archive_browser.cjs
  live-service-report:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe official Shamela MCP and browser access
        run: node tests/probe_shamela.cjs
      - name: Probe Turath MCP and browser access
        run: node tests/probe_turath.cjs
      - name: Probe official newspaper page text API
        run: node tests/probe_loc_text.cjs
      - name: Check public catalogs and browser CORS (diagnostic, services may be unavailable)
        run: node tests/check_live_services.cjs
      - name: Install browser test driver
        run: npm install --prefix "$RUNNER_TEMP/sanad-qa" puppeteer-core@24 --no-audit --no-fund
      - name: Diagnose Turath MCP real browser initialization
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/probe_turath_browser.cjs
      - name: Probe Internet Archive text access in a browser
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/probe_archive.cjs
      - name: Test Internet Archive OCR import in browser and local app
        run: |
          NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/ui_archive.cjs
          NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/ui_local_archive.py
      - name: Test Turath MCP UI in browser and local app
        run: |
          NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/ui_turath.cjs
          NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/ui_local_turath.py
      - name: Test Wikisource import and search in a mobile browser
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/ui_wikisource.cjs
      - name: Test manual source workflow and responsive navigation
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/ui_manual.cjs
      - name: Test OpenITI text import, searching and individual source retries
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/ui_sources.cjs
      - name: Test local multi-source comparison in browser
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/ui_comparison.cjs
      - name: Test official Shamela UI with local Python backend
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/ui_local_shamela.py
      - name: Test multi-source comparison with local Python backend
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/ui_local_backend.py
      - name: Check mobile browser against live public services
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/live_browser.cjs
