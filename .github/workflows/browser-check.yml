name: Check browser edition
on:
  push:
    branches:
      - 'arena/592bf7be-sanad'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js
      - run: node --check web/browser-engine.js
      - run: node --check web/mineru-import.js
      - run: node --check web/research-planner.js
      - run: node --check web/ocr-journal.js
      - run: node --check web/history-dates.js
      - run: node --check web/hadith-lookup.js
      - run: node --check web/open-access.js
      - run: node tests/test_open_access.cjs
      - run: node --check web/text-alignment.js
      - run: node tests/test_text_alignment.cjs
      - run: node tests/test_hadith_lookup.cjs
      - run: node tests/test_history_dates.cjs
      - run: node tests/test_research_planner.cjs
      - run: node tests/test_mineru_import.cjs
      - run: node tests/test_browser_engine.cjs
      - run: node tests/test_archive_browser.cjs
  live-service-report:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe official Shamela MCP and browser access
        run: node tests/probe_shamela.cjs
      - name: Probe Turath MCP and browser access
        run: node tests/probe_turath.cjs
      - name: Probe Alexandria Archive MCP
        run: node tests/probe_alexandria.cjs
      - name: Probe official newspaper page text API
        run: node tests/probe_loc_text.cjs
      - name: Check public catalogs and browser CORS (diagnostic, services may be unavailable)
        run: node tests/check_live_services.cjs
      - name: Install browser test driver
        run: npm install --prefix "$RUNNER_TEMP/sanad-qa" puppeteer-core@24 --no-audit --no-fund
      - name: Test responsive interface, save races and file integrity
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/ui_quality.cjs && NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/ui_initial_load.cjs
      - name: Test attributed passage alignment in browser and local modes
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/ui_local_text_alignment.py
      - name: Test one-record hadith lookup in browser and local modes
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/ui_local_hadith.py
      - name: Diagnose live Hadith API in Chromium (availability is not guaranteed)
        continue-on-error: true
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/live_local_hadith.py
      - name: Test the end-to-end researcher workflow in browser and local modes
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/ui_local_real_workflow.py
      - name: Install PDF test helper
        run: python -m pip install pypdf==7.0.0
      - name: Test PDF extraction and malformed files in browser and local modes
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/ui_local_pdf_security.py
      - name: Test real local Arabic and English OCR and PDF in browser and local modes
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/ui_local_ocr.py
      - name: Diagnose deployed Pages OCR after publishing
        if: github.event_name == 'workflow_dispatch'
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/probe_ocr_pages.cjs
      - name: Diagnose OCR on a historic public-domain Arabic scan
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/live_ocr_scan.py
      - name: Test offline multipage Arabic and English PDF OCR
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/ui_local_ocr_batch.py
      - name: Test Hijri estimates, local name variants and printed citations in both modes
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/ui_local_history.py
      - name: Test unified heritage search, consent and retries in both modes
        run: |
          for test in tests/ui_local_heritage_research.py tests/ui_local_heritage_real.py tests/ui_local_heritage_browser.py; do
            set +e
            NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python "$test" > "$RUNNER_TEMP/heritage-test.log" 2>&1
            status=$?
            set -e
            cat "$RUNNER_TEMP/heritage-test.log"
            if [ "$status" -ne 0 ]; then
              detail=$(tail -15 "$RUNNER_TEMP/heritage-test.log" | tr '\n' ' ' | sed 's/%/%25/g')
              echo "::error title=Heritage UI failed: $test::$detail"
              exit "$status"
            fi
          done
      - name: Test Persian and Turkish Wikisource discovery and page reading
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/ui_local_wikisource_regional.py
      - name: Test open-copy lookup in both modes
        run: |
          NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/ui_local_open_access.py
          NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/ui_local_open_access_real.py
      - name: Diagnose live OpenAlex in Chromium (availability may vary)
        continue-on-error: true
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/live_local_open_access.py
      - name: Test multi-query research UI in browser and local modes
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/ui_local_research_expanded.py
      - name: Test real local research HTTP API with mocked providers
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/ui_local_research_network.py
      - name: Test MinerU result import in browser and local modes
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/ui_local_mineru.py
      - name: Test complete backup interoperability
        run: |
          set +e
          NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/ui_local_backup.py > "$RUNNER_TEMP/backup-test.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/backup-test.log"
          if [ "$status" -ne 0 ]; then
            detail=$(tail -15 "$RUNNER_TEMP/backup-test.log" | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=Backup interoperability test failed::$detail"
          fi
          exit "$status"
      - name: Test Qatar record search interface
        run: |
          NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/ui_qdl.cjs
          NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/ui_local_qdl.py
      - name: Diagnose Qatar record search in Chromium
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/probe_qdl.cjs
      - name: Diagnose Alexandria MCP real browser initialization
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/probe_alexandria_browser.cjs
      - name: Test Alexandria MCP local UI
        run: |
          set +e
          NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/ui_local_alexandria.py > "$RUNNER_TEMP/alex-test.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/alex-test.log"
          if [ "$status" -ne 0 ]; then
            detail=$(tail -15 "$RUNNER_TEMP/alex-test.log" | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=Alexandria UI test failed::$detail"
          fi
          exit "$status"
      - name: Diagnose Turath MCP real browser initialization
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/probe_turath_browser.cjs
      - name: Test OpenITI corpus local install, search and save UI
        run: |
          set +e
          NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/ui_local_openiti_corpus.py > "$RUNNER_TEMP/corpus-ui-test.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/corpus-ui-test.log"
          if [ "$status" -ne 0 ]; then
            detail=$(tail -15 "$RUNNER_TEMP/corpus-ui-test.log" | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=OpenITI corpus UI failed::$detail"
          fi
          exit "$status"
      - name: Diagnose searching real texts from the OpenITI primary ZIP
        run: python tests/live_openiti_corpus.py
      - name: Diagnose official OpenITI release ZIP directory
        run: python tests/probe_openiti_release.py
      - name: Probe Internet Archive text access in a browser
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/probe_archive.cjs
      - name: Test Internet Archive OCR import in browser and local app
        run: |
          set +e
          NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/ui_archive.cjs > "$RUNNER_TEMP/archive-test.log" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/ui_local_archive.py >> "$RUNNER_TEMP/archive-test.log" 2>&1; status=$?; fi
          cat "$RUNNER_TEMP/archive-test.log"
          if [ "$status" -ne 0 ]; then
            detail=$(tail -20 "$RUNNER_TEMP/archive-test.log" | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=Archive OCR UI test failed::$detail"
          fi
          exit "$status"
      - name: Test Turath MCP UI in browser and local app
        run: |
          NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/ui_turath.cjs
          NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/ui_local_turath.py
      - name: Test multilingual rendered Wikisource and local search
        run: |
          NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/ui_wikisource_rendered.cjs
          NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/ui_local_wikisource_rendered.py
      - name: Test Open Library editions and Archive OCR in browser and local app
        run: |
          NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/ui_openlibrary_editions.cjs
          NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/ui_local_openlibrary_editions.py
      - name: Diagnose Open Library editions and OCR live in Chromium
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/probe_openlibrary_editions.cjs
      - name: Diagnose multilingual Wikisource in Chromium
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/probe_wikisource_multilingual.cjs
      - name: Test Wikisource import and search in a mobile browser
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/ui_wikisource.cjs
      - name: Test manual source workflow and responsive navigation
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/ui_manual.cjs
      - name: Test OpenITI text import, searching and individual source retries
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/ui_sources.cjs
      - name: Test local multi-source comparison in browser
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/ui_comparison.cjs
      - name: Test official Shamela UI with local Python backend
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/ui_local_shamela.py
      - name: Test multi-source comparison with local Python backend
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/ui_local_backend.py
      - name: Check mobile browser against live public services
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" node tests/live_browser.cjs
  full-corpus-diagnostic:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and search the full official corpus (diagnostic, 2.86 GB)
        run: python tests/diagnose_full_openiti.py

  expanded-research-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --prefix "$RUNNER_TEMP/sanad-qa" puppeteer-core@24 --no-audit --no-fund
      - name: Probe real public historical queries (diagnostic)
        run: NODE_PATH="$RUNNER_TEMP/sanad-qa/node_modules" python tests/live_expanded_research.py
